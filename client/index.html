<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#dde3eb" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      (function () {
        var pref; try { pref = localStorage.getItem('theme'); } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>

    <title>Job Tracker</title>

</html>
